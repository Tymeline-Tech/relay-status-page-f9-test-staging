openapi: 3.0.2
info:
  title: Relay Status Page API
  description: >
    Technical contract for the Relay Status Page service. Defines service health status and incident
    management endpoints consumed by the React frontend and monitoring agents. This specification is
    the single source of truth for the frontend/backend integration.
  version: 1.0.0
  contact:
    name: Relay Platform Team
servers:
  - url: /
    description: Relative to the API host
tags:
  - name: Status
    description: Service health status
  - name: Incidents
    description: Incident lifecycle management
paths:
  /api/status:
    get:
      tags:
        - Status
      operationId: listServiceStatuses
      summary: List service statuses
      description: Returns the current health status for all tracked services.
      responses:
        "200":
          description: Current service statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceStatus"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - Status
      operationId: upsertServiceStatus
      summary: Create or update a service status
      description: Ingests a health-check result for a named service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceStatus"
      responses:
        "201":
          description: Status recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/incidents:
    get:
      tags:
        - Incidents
      operationId: listIncidents
      summary: List incidents
      description: Returns known incidents, optionally filtered by query parameters.
      parameters:
        - name: service_id
          in: query
          required: false
          description: Filter incidents by related service identifier
          schema:
            type: string
        - name: severity
          in: query
          required: false
          description: Filter incidents by severity level
          schema:
            $ref: "#/components/schemas/IncidentSeverity"
        - name: resolved
          in: query
          required: false
          description: When true, return only resolved incidents; when false, only open ones
          schema:
            type: boolean
      responses:
        "200":
          description: Incident list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Incident"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - Incidents
      operationId: createIncident
      summary: Create an incident
      description: Opens a new incident record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Incident"
      responses:
        "201":
          description: Incident created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  schemas:
    ServiceStatusEnum:
      type: string
      description: Traffic-light health indicator for a service
      enum:
        - green
        - yellow
        - red
    IncidentSeverity:
      type: string
      description: Impact severity of an incident
      enum:
        - low
        - med
        - high
        - critical
    ServiceStatus:
      type: object
      description: Current health status for a single service
      required:
        - id
        - name
        - status
        - last_checked
      properties:
        id:
          type: string
          description: Stable service identifier
        name:
          type: string
          minLength: 1
          description: Human-readable service name
        status:
          $ref: "#/components/schemas/ServiceStatusEnum"
        last_checked:
          type: string
          format: date-time
          description: Timestamp of the most recent health check (ISO-8601)
    Incident:
      type: object
      description: A service interruption or degradation event
      required:
        - id
        - service_id
        - title
        - severity
        - description
        - started_at
      properties:
        id:
          type: string
          description: Stable incident identifier
        service_id:
          type: string
          description: Identifier of the affected service
        title:
          type: string
          minLength: 1
          description: Short human-readable incident title
        severity:
          $ref: "#/components/schemas/IncidentSeverity"
        description:
          type: string
          description: Detailed description of the incident
        started_at:
          type: string
          format: date-time
          description: When the incident began (ISO-8601)
        resolved_at:
          type: string
          format: date-time
          nullable: true
          description: When the incident was resolved; null if still open
    ErrorBody:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
